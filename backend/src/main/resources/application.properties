server.port=${PORT:8080}

# Secrets come from environment variables, never written here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billdrop}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Let the server start even if MySQL is not ready yet
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

billdrop.frontend-url=${FRONTEND_URL:http://localhost:5173}
